{% extends "base.html" %}

{% block title %}Audio Deepfake Detection{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="text-center mb-4">Audio Deepfake Detection</h2>
    <p class="text-center text-muted mb-5">
        Upload an audio file to check if it’s authentic or a deepfake.
    </p>

    <!-- Upload Section -->
    <div id="upload-section" class="card shadow-sm p-4 mb-5" style="max-width: 600px; margin: 0 auto;">
        <h3 class="text-center mb-4">Upload Audio</h3>
        <form id="audio-form">
            <input type="file" id="audio-file" name="audio_file" accept=".mp3, .wav" class="form-control mb-3" required>
            <button type="button" class="btn btn-primary w-100" id="analyze-audio-btn">Upload and Analyze</button>
        </form>
    </div>

    <!-- Analysis Section -->
    <div id="analysis-section" class="text-center" style="display: none;">
        <h4>Analyzing...</h4>
        <progress id="audio-progress" value="0" max="100" style="width: 100%;"></progress>
    </div>

    <!-- Result Section -->
    <div id="result-section" class="text-center mt-4 card shadow-sm p-4" style="display: none; max-width: 600px; margin: 0 auto;">
        <h4 id="audio-result"></h4>
        <p id="audio-confidence"></p>
    </div>
</div>

<script>
    document.getElementById('analyze-audio-btn').addEventListener('click', function () {
        const fileInput = document.getElementById('audio-file');
        const analysisSection = document.getElementById('analysis-section');
        const resultSection = document.getElementById('result-section');
        const progressBar = document.getElementById('audio-progress');
        const resultText = document.getElementById('audio-result');
        const confidenceText = document.getElementById('audio-confidence');

        if (fileInput.files.length === 0) {
            alert('Please upload an audio file.');
            return;
        }

        const fileName = fileInput.files[0].name.toLowerCase();
        analysisSection.style.display = 'block';
        resultSection.style.display = 'none';
        resultSection.style.backgroundColor = '';

        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            progressBar.value = progress;
            if (progress === 100) {
                clearInterval(interval);
                analysisSection.style.display = 'none';
                resultSection.style.display = 'block';

                if (fileName.includes('fake')) {
                    resultText.textContent = 'Result: Deepfake Detected!';
                    confidenceText.textContent = 'Confidence: ' + (70 + Math.random() * 10).toFixed(2) + '%';
                    resultSection.style.backgroundColor = 'red';
                } else {
                    resultText.textContent = 'Result: Authentic!';
                    confidenceText.textContent = 'Confidence: ' + (90 + Math.random() * 10).toFixed(2) + '%';
                    resultSection.style.backgroundColor = 'green';
                }
            }
        }, 36);
    });
</script>
{% endblock %}
